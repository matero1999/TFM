<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Jurídico-Laboral BOE</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.7"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.3.1",
            "react/": "https://esm.sh/react@18.3.1/",
            "react-dom": "https://esm.sh/react-dom@18.3.1",
            "react-dom/": "https://esm.sh/react-dom@18.3.1/",
            "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
            "lucide-react": "https://esm.sh/lucide-react@0.474.0?external=react"
        }
    }
    </script>
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
<div id="root"></div>
<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useRef, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import {
  Scale, Send, ChevronDown, ChevronUp, ExternalLink,
  AlertCircle, CheckCircle, Clock, Loader2, BookOpen,
  MessageSquare, Database, Zap, RefreshCw, Info, Shield, X
} from 'lucide-react';

const API_BASE = "http://localhost:8000/api/v1";

const PREGUNTAS_SUGERIDAS = [
  "¿Cuál es la jornada máxima de trabajo semanal en España?",
  "¿Cuáles son las causas del despido disciplinario?",
  "¿Qué prestaciones cubre la incapacidad temporal?",
  "¿Cuánto dura el período de prueba en un contrato indefinido?",
  "¿Cuánto cobra un trabajador en situación de desempleo?",
];

function formatLatencia(ms) {
  if (!ms) return "—";
  if (ms < 1000) return `${ms} ms`;
  return `${(ms / 1000).toFixed(1)} s`;
}

function formatCoste(usd) {
  if (usd === 0 || !usd) return "€ 0.00 (local)";
  return `$ ${usd.toFixed(5)}`;
}

// ── Badge estado API ─────────────────────────────────────────────
function ApiStatusBadge({ status }) {
  const configs = {
    ok:          { cls: "bg-emerald-100 text-emerald-700 border-emerald-200", icon: <CheckCircle className="w-3 h-3" />, label: "API Conectada" },
    error:       { cls: "bg-red-100 text-red-700 border-red-200",             icon: <AlertCircle className="w-3 h-3" />, label: "API Desconectada" },
    checking:    { cls: "bg-amber-100 text-amber-700 border-amber-200",       icon: <Loader2 className="w-3 h-3 animate-spin" />, label: "Verificando..." },
    procesando:  { cls: "bg-blue-100 text-blue-700 border-blue-200",          icon: <Loader2 className="w-3 h-3 animate-spin" />, label: "Procesando..." },
  };
  const cfg = configs[status] || configs.checking;
  return (
    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium border ${cfg.cls}`}>
      {cfg.icon}{cfg.label}
    </span>
  );
}

// ── Tarjeta de fuente ────────────────────────────────────────────
function FuenteCard({ fuente, index }) {
  return (
    <div className="flex items-start gap-2.5 p-2.5 bg-slate-50 rounded-xl border border-slate-200 hover:border-blue-300 transition-colors">
      <span className="flex-shrink-0 w-5 h-5 bg-blue-700 text-white rounded-full text-xs flex items-center justify-center font-bold mt-0.5">
        {index + 1}
      </span>
      <div className="flex-1 min-w-0">
        <p className="text-xs font-semibold text-slate-800 leading-snug">
          {fuente.titulo_bloque || "Sin título"}
        </p>
        <p className="text-xs text-slate-500 mt-0.5 leading-snug line-clamp-2">
          {fuente.ley_titulo}
        </p>
        {fuente.url_boe && (
          <a href={fuente.url_boe} target="_blank" rel="noopener noreferrer"
            className="inline-flex items-center gap-1 text-xs text-blue-600 hover:text-blue-800 mt-1 font-medium">
            Ver en BOE <ExternalLink className="w-3 h-3" />
          </a>
        )}
      </div>
      <span className="text-xs text-slate-400 flex-shrink-0 font-mono">
        {fuente.score_rrf?.toFixed(4)}
      </span>
    </div>
  );
}

// ── Mensaje del asistente ────────────────────────────────────────
function MensajeAsistente({ msg }) {
  const [verFuentes, setVerFuentes] = useState(false);
  const tieneFuentes = msg.fuentes && msg.fuentes.length > 0;

  return (
    <div className="flex gap-3">
      <div className="flex-shrink-0 w-8 h-8 bg-blue-800 rounded-xl flex items-center justify-center shadow-sm">
        <Scale className="w-4 h-4 text-white" />
      </div>
      <div className="flex-1 max-w-2xl space-y-2">
        {/* Burbuja */}
        <div className="bg-white border border-slate-200 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm">
          <p className="text-sm text-slate-800 whitespace-pre-wrap leading-relaxed">{msg.respuesta}</p>
        </div>

        {/* Métricas */}
        {msg.latencia_ms > 0 && (
          <div className="flex flex-wrap items-center gap-x-4 gap-y-1 px-1">
            <span className="flex items-center gap-1 text-xs text-slate-400">
              <Clock className="w-3 h-3" />{formatLatencia(msg.latencia_ms)}
            </span>
            <span className="flex items-center gap-1 text-xs text-slate-400">
              <Zap className="w-3 h-3" />{msg.tokens_entrada}↑ {msg.tokens_salida}↓
            </span>
            <span className="text-xs text-slate-400">{formatCoste(msg.coste_usd)}</span>
            <span className="text-xs text-slate-400 italic truncate max-w-48">{msg.modelo}</span>
          </div>
        )}

        {/* Fuentes */}
        {tieneFuentes && (
          <div className="px-1">
            <button onClick={() => setVerFuentes(!verFuentes)}
              className="inline-flex items-center gap-1.5 text-xs text-blue-700 hover:text-blue-900 font-medium transition-colors">
              <BookOpen className="w-3.5 h-3.5" />
              {msg.fuentes.length} fuente{msg.fuentes.length !== 1 ? "s" : ""} del BOE
              {verFuentes ? <ChevronUp className="w-3 h-3" /> : <ChevronDown className="w-3 h-3" />}
            </button>
            {verFuentes && (
              <div className="mt-2 space-y-1.5">
                {msg.fuentes.map((f, i) => <FuenteCard key={i} fuente={f} index={i} />)}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Mensaje del usuario ──────────────────────────────────────────
function MensajeUsuario({ texto }) {
  return (
    <div className="flex justify-end">
      <div className="bg-blue-700 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-lg shadow-sm">
        <p className="text-sm leading-relaxed">{texto}</p>
      </div>
    </div>
  );
}

// ── Indicador de carga ───────────────────────────────────────────
function Cargando() {
  return (
    <div className="flex gap-3">
      <div className="flex-shrink-0 w-8 h-8 bg-blue-800 rounded-xl flex items-center justify-center shadow-sm">
        <Scale className="w-4 h-4 text-white" />
      </div>
      <div className="bg-white border border-slate-200 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm">
        <div className="flex items-center gap-2 text-sm text-slate-500">
          <Loader2 className="w-4 h-4 animate-spin text-blue-700" />
          <span>Consultando el corpus del BOE...</span>
        </div>
        <div className="flex gap-1 mt-2">
          {["Recuperando artículos", "Generando respuesta", "Verificando citas"].map((paso, i) => (
            <span key={i} className="text-xs px-2 py-0.5 bg-blue-50 text-blue-600 rounded-full animate-pulse"
              style={{ animationDelay: `${i * 0.3}s` }}>
              {paso}
            </span>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Bienvenida ───────────────────────────────────────────────────
function Bienvenida({ onSugerencia }) {
  return (
    <div className="flex flex-col items-center justify-center h-full px-6 text-center">
      <div className="w-20 h-20 bg-blue-800 rounded-3xl flex items-center justify-center mb-5 shadow-xl">
        <Scale className="w-10 h-10 text-white" />
      </div>
      <h2 className="text-2xl font-bold text-slate-800 mb-2">Asistente Jurídico-Laboral</h2>
      <p className="text-sm text-slate-500 max-w-md mb-1">
        Especializado en Derecho Laboral y Seguridad Social español.
        Todas las respuestas se fundamentan exclusivamente en el BOE.
      </p>
      <div className="flex flex-wrap items-center justify-center gap-2 mb-8 mt-2">
        {["Estatuto de los Trabajadores", "LGSS", "Reforma Laboral 2021"].map((n, i) => (
          <span key={i} className="text-xs px-2.5 py-1 bg-blue-100 text-blue-700 rounded-full font-medium">{n}</span>
        ))}
      </div>
      <p className="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-3">Consultas frecuentes</p>
      <div className="grid gap-2 w-full max-w-lg">
        {PREGUNTAS_SUGERIDAS.map((p, i) => (
          <button key={i} onClick={() => onSugerencia(p)}
            className="text-left text-sm px-4 py-2.5 bg-white border border-slate-200 rounded-xl hover:border-blue-400 hover:bg-blue-50 transition-all text-slate-700 shadow-sm">
            {p}
          </button>
        ))}
      </div>
    </div>
  );
}

// ── Panel corpus ─────────────────────────────────────────────────
function PanelCorpus({ info, onClose }) {
  return (
    <div className="w-72 bg-white border-l border-slate-200 flex flex-col">
      <div className="px-4 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
        <div className="flex items-center gap-2">
          <Database className="w-4 h-4 text-blue-700" />
          <span className="text-sm font-semibold text-slate-800">Corpus BOE</span>
        </div>
        <button onClick={onClose} className="w-6 h-6 flex items-center justify-center rounded-full hover:bg-slate-200 text-slate-500 transition-colors">
          <X className="w-4 h-4" />
        </button>
      </div>
      <div className="flex-1 overflow-y-auto p-4 space-y-4">
        {info ? (
          <>
            <div className="grid grid-cols-2 gap-3">
              <div className="bg-blue-50 rounded-xl p-3 text-center border border-blue-100">
                <p className="text-2xl font-bold text-blue-800">{info.total_chunks}</p>
                <p className="text-xs text-blue-600 mt-0.5 font-medium">Artículos</p>
              </div>
              <div className="bg-emerald-50 rounded-xl p-3 text-center border border-emerald-100">
                <p className="text-2xl font-bold text-emerald-800">{info.total_normas}</p>
                <p className="text-xs text-emerald-600 mt-0.5 font-medium">Normas</p>
              </div>
            </div>
            <div>
              <p className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Normas indexadas</p>
              <div className="space-y-2">
                {info.normas?.map((n, i) => (
                  <div key={i} className="bg-slate-50 rounded-xl p-3 border border-slate-200">
                    <p className="text-xs font-medium text-slate-700 leading-snug line-clamp-3">
                      {n.ley_titulo}
                    </p>
                    <div className="flex items-center justify-between mt-2">
                      <span className="text-xs text-slate-400">{n.n_chunks} artículos</span>
                      {n.url_boe && (
                        <a href={n.url_boe} target="_blank" rel="noopener noreferrer"
                          className="text-xs text-blue-600 hover:underline flex items-center gap-0.5 font-medium">
                          BOE <ExternalLink className="w-2.5 h-2.5" />
                        </a>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
              <p className="text-xs text-amber-700 font-semibold flex items-center gap-1 mb-1">
                <Info className="w-3.5 h-3.5" />Limitaciones del corpus
              </p>
              <p className="text-xs text-amber-600 leading-relaxed">
                Solo fuentes del BOE. No incluye convenios colectivos, jurisprudencia ni normativa autonómica.
              </p>
            </div>
          </>
        ) : (
          <div className="flex items-center justify-center h-32 text-sm text-slate-400">
            <Loader2 className="w-4 h-4 animate-spin mr-2" />Cargando...
          </div>
        )}
      </div>
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────────
function App() {
  const [mensajes, setMensajes]           = useState([]);
  const [input, setInput]                 = useState("");
  const [cargando, setCargando]           = useState(false);
  const [apiStatus, setApiStatus]         = useState("checking");
  const [apiInfo, setApiInfo]             = useState(null);
  const [corpusInfo, setCorpusInfo]       = useState(null);
  const [mostrarCorpus, setMostrarCorpus] = useState(false);

  const endRef      = useRef(null);
  const inputRef    = useRef(null);

  useEffect(() => {
    endRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [mensajes, cargando]);

  // Ref para pausar el health check durante la inferencia
  const procesandoRef = useRef(false);

  const checkHealth = useCallback(async () => {
    // No sobrescribir el estado "procesando" con un falso "error"
    if (procesandoRef.current) return;
    try {
      const r = await fetch(`${API_BASE}/health`, { signal: AbortSignal.timeout(5000) });
      if (!r.ok) throw new Error();
      const d = await r.json();
      setApiInfo(d);
      setApiStatus("ok");
    } catch {
      if (!procesandoRef.current) {
        setApiStatus("error");
        setApiInfo(null);
      }
    }
  }, []);

  const cargarCorpus = useCallback(async () => {
    try {
      const r = await fetch(`${API_BASE}/corpus/info`, { signal: AbortSignal.timeout(5000) });
      if (!r.ok) return;
      setCorpusInfo(await r.json());
    } catch {}
  }, []);

  useEffect(() => {
    checkHealth();
    cargarCorpus();
    const iv = setInterval(checkHealth, 30000);
    return () => clearInterval(iv);
  }, [checkHealth, cargarCorpus]);

  const enviar = useCallback(async (texto) => {
    const pregunta = (texto || input).trim();
    if (!pregunta || cargando) return;
    setInput("");

    setMensajes(p => [...p, { tipo: "usuario", texto: pregunta, id: Date.now() }]);
    setCargando(true);

    // Pausar health check y mostrar estado "procesando"
    procesandoRef.current = true;
    setApiStatus("procesando");

    try {
      const r = await fetch(`${API_BASE}/consulta`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pregunta, top_k: 3, backend: "salamandra" }),
      });
      if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || `Error ${r.status}`); }
      const d = await r.json();
      setMensajes(p => [...p, { tipo: "asistente", id: Date.now() + 1, ...d }]);
    } catch (e) {
      setMensajes(p => [...p, {
        tipo: "asistente", id: Date.now() + 1,
        respuesta: `⚠️ No se pudo conectar con el servidor.\n\n${e.message}\n\nAsegúrese de que la API está activa:\nuvicorn api.main:app --port 8000`,
        fuentes: [], latencia_ms: 0, tokens_entrada: 0, tokens_salida: 0, coste_usd: 0, modelo: "—",
      }]);
    } finally {
      // Reanudar health check y verificar estado real
      procesandoRef.current = false;
      setCargando(false);
      inputRef.current?.focus();
      // Verificar estado real de la API tras completar
      checkHealth();
    }
  }, [input, cargando, checkHealth]);

  const handleKey = (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); }
  };

  return (
    <div className="flex flex-col h-screen bg-slate-50">

      {/* Header */}
      <header className="bg-blue-900 text-white px-4 py-3 flex items-center justify-between shadow-lg flex-shrink-0">
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 bg-white/15 rounded-xl flex items-center justify-center">
            <Scale className="w-5 h-5 text-white" />
          </div>
          <div>
            <h1 className="text-sm font-bold leading-tight">Asistente Jurídico-Laboral BOE</h1>
            <p className="text-xs text-blue-300 leading-tight">España · RAG Pipeline · TFM</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <ApiStatusBadge status={apiStatus} />
          {apiInfo?.corpus_chunks && (
            <span className="hidden sm:flex items-center gap-1 text-xs text-blue-300">
              <Database className="w-3 h-3" />{apiInfo.corpus_chunks} arts.
            </span>
          )}
          <button onClick={() => { setMostrarCorpus(!mostrarCorpus); cargarCorpus(); }}
            className={`p-1.5 rounded-lg transition-colors ${mostrarCorpus ? "bg-white/25" : "hover:bg-white/15"}`}
            title="Información del corpus">
            <Database className="w-4 h-4" />
          </button>
          {mensajes.length > 0 && (
            <button onClick={() => setMensajes([])}
              className="p-1.5 rounded-lg hover:bg-white/15 transition-colors" title="Nueva conversación">
              <RefreshCw className="w-4 h-4" />
            </button>
          )}
        </div>
      </header>

      {/* Cuerpo */}
      <div className="flex flex-1 overflow-hidden">

        {/* Chat */}
        <div className="flex-1 flex flex-col overflow-hidden">

          {/* Mensajes */}
          <div className="flex-1 overflow-y-auto px-4 py-6 space-y-5">
            {mensajes.length === 0
              ? <Bienvenida onSugerencia={(p) => enviar(p)} />
              : mensajes.map(m =>
                  m.tipo === "usuario"
                    ? <MensajeUsuario key={m.id} texto={m.texto} />
                    : <MensajeAsistente key={m.id} msg={m} />
                )
            }
            {cargando && <Cargando />}
            <div ref={endRef} />
          </div>

          {/* Aviso API caída */}
          {apiStatus === "error" && (
            <div className="mx-4 mb-2 px-3 py-2 bg-red-50 border border-red-200 rounded-xl flex items-start gap-2 text-xs text-red-700">
              <AlertCircle className="w-3.5 h-3.5 flex-shrink-0 mt-0.5" />
              <span>
                API no disponible. Ejecute:{" "}
                <code className="font-mono bg-red-100 px-1 rounded">uvicorn api.main:app --reload --port 8000</code>
              </span>
            </div>
          )}

          {/* Input */}
          <div className="px-4 pb-4 flex-shrink-0">
            <div className="bg-white border border-slate-300 rounded-2xl shadow-sm focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-100 transition-all">
              <textarea
                ref={inputRef}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={handleKey}
                placeholder="Escriba su consulta jurídico-laboral... (Enter para enviar, Shift+Enter para nueva línea)"
                rows={2}
                disabled={cargando || apiStatus === "error"}
                className="w-full px-4 pt-3 pb-1 text-sm text-slate-800 placeholder-slate-400 bg-transparent resize-none focus:outline-none disabled:opacity-50"
              />
              <div className="flex items-center justify-between px-3 pb-2.5">
                <div className="flex items-center gap-1.5 text-xs text-slate-400">
                  <Shield className="w-3 h-3" />
                  Solo fuentes verificadas del BOE
                </div>
                <button
                  onClick={() => enviar()}
                  disabled={!input.trim() || cargando || apiStatus === "error"}
                  className="flex items-center gap-1.5 px-3 py-1.5 bg-blue-800 text-white text-xs font-semibold rounded-xl hover:bg-blue-900 disabled:opacity-40 disabled:cursor-not-allowed transition-colors shadow-sm">
                  {cargando
                    ? <><Loader2 className="w-3.5 h-3.5 animate-spin" />Procesando...</>
                    : <><Send className="w-3.5 h-3.5" />Consultar</>
                  }
                </button>
              </div>
            </div>
            <p className="text-center text-xs text-slate-400 mt-2">
              Las respuestas se basan exclusivamente en el corpus del BOE y no constituyen asesoramiento jurídico.
            </p>
          </div>
        </div>

        {/* Panel corpus */}
        {mostrarCorpus && <PanelCorpus info={corpusInfo} onClose={() => setMostrarCorpus(false)} />}
      </div>
    </div>
  );
}

createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
